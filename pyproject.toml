[project]
name = "agentic-lean-math-assistant"
version = "1.1.1"
description = "Evidence-retaining mathematical research and Lean formalization assistant"
readme = "README.md"
requires-python = ">=3.12, <3.15"
authors = [{ name = "Rosa Pavlak" }]
license = { file = "LICENSE" }
keywords = ["formal-verification", "lean4", "mathematics", "multi-agent-systems", "reproducible-research"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "mpmath>=1.3.0",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
research = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "python-flint>=0.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "tqdm>=4.70.0",
]
ml = [
    "numpy>=1.26",
    "tensorflow>=2.18; python_version < '3.14'",
]

[dependency-groups]
dev = [
    "hypothesis>=6.165.5",
    "mypy>=2.3.0",
    "numpy>=2.5.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[project.scripts]
agentic-lean-math-assistant = "agentic_lean_math_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_lean_math_assistant"]

[tool.hatch.build.targets.sdist]
include = [
    "src/agentic_lean_math_assistant",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]
exclude = [
    "/.github",
    "/.hypothesis",
    "/.python-version",
    "/.gitignore",
    "/tests",
    "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
