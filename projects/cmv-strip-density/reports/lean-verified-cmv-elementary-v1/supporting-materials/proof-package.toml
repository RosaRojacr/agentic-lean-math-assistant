[[roots]]
module = "CMVElementaryGeometry"
declaration = "CMVElementary.geometric_comparison"
role = "primary"
type = "∀ lam : ℝ, 1 < lam → 0 < CMVElementary.gamma lam ∧ ∀ h : ℝ, 0 < h → h ≤ 1 → ∃ r : ℝ, 0 < r ∧ r < h ∧ WeightedArea lam (CMVElementary.E lam r) = WeightedArea lam (CMVElementary.C lam h) ∧ CMVElementary.gamma lam / h < WeightedPerimeter lam (FrontierMeasure (CMVElementary.C lam h)) - WeightedPerimeter lam (FrontierMeasure (CMVElementary.E lam r)) ∧ 0 < CMVElementary.gamma lam / h"
informal_statement = "For every lambda > 1, gamma(lambda) is positive; for every 0 < h <= 1 there is 0 < r < h with equal canonical Lebesgue weighted areas of E_r and C_h and canonical Euclidean complete-frontier perimeter difference greater than gamma(lambda)/h > 0. The geometric formulas are conclusions, not additional hypotheses."

[[roots]]
module = "CMVElementary"
declaration = "CMVElementary.scalar_comparison"
role = "secondary"
type = "∀ lam : ℝ, 1 < lam → 0 < CMVElementary.gamma lam ∧ ∀ h : ℝ, 0 < h → h ≤ 1 → ∃ r : ℝ, 0 < r ∧ r < h ∧ CMVElementary.A3 lam r = CMVElementary.A4 lam h ∧ CMVElementary.gamma lam / h < CMVElementary.P4 lam h - CMVElementary.P3 lam r ∧ 0 < CMVElementary.gamma lam / h"
informal_statement = "For every lambda > 1, gamma(lambda) > 0; for every 0 < h <= 1 there is 0 < r < h with A3(lambda,r) = A4(lambda,h) and P4(lambda,h)-P3(lambda,r) > gamma(lambda)/h > 0, by the required new elementary route."

[[roots]]
module = "CMVElementary"
declaration = "CMVElementary.elementary_route"
role = "secondary"
type = "∀ lam : ℝ, 1 < lam → CMVElementary.ElementaryRoute lam"
informal_statement = "Prove all AuxiliaryClaims, SameCurvatureClaims, ThreeArcCalculusClaims and ScalarIdentificationClaims, including square-root normalization, J/H lower bounds and endpoint extensions; for each 0 < h <= 1 construct epsilon and the greatest equal-area root r with compact nonempty level set, strict barrier, Q derivative and Q(r) < Q(h), without root uniqueness or global A3 monotonicity."

[[roots]]
module = "CMVElementaryGeometry"
declaration = "CMVElementary.geometric_realization"
role = "secondary"
type = "∀ lam : ℝ, 1 < lam → (∀ h : ℝ, 0 < h → h ≤ 1 → CMVElementary.FourArcRealization lam h) ∧ (∀ r : ℝ, 0 < r → r < 1 → CMVElementary.ThreeArcRealization lam r)"
informal_statement = "For every lambda > 1, prove FourArcRealization for all 0 < h <= 1 and ThreeArcRealization for all 0 < r < 1: literal coordinate carriers equal copied library carriers, actual area/perimeter identities and geometric regularity and finiteness, matching-chord interiors, the reflected lower cap, the exposed bottom frontier, major-cap angles and the radius-two disk at r = 1/2."
