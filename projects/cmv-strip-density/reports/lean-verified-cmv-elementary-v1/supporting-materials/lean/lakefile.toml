name = "CMVElementaryVerification"
version = "0.1.0"
defaultTargets = ["ProofPackage"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc2"

[[lean_lib]]
name = "ProofPackage"
srcDir = "."
roots = ["CMVElementary", "CMVElementaryGeometry", "CMVGeometry", "FourArcCandidate", "FrontierPerimeter", "GreatestLevelRoot", "LeanSuffixAnalytic", "MorgansArcFunction", "TypeThreeAssembly"]
